  <rect x="72" y="66" width="56" height="56" rx="14" fill="#f5a623"/><text x="100" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="800" fill="#0b2239">JP</text>
  <text x="72" y="202" font-family="Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="3" fill="#f5a623">DOCUMENTACIÓN TÉCNICA</text>
  <text x="72" y="284" font-family="Arial,sans-serif" font-size="64" font-weight="800" fill="#fff">Planos PIG</text><text x="72" y="352" font-family="Arial,sans-serif" font-size="64" font-weight="800" fill="#fff">con criterio de obra.</text>
  <text x="75" y="414" font-family="Arial,sans-serif" font-size="24" fill="#fff" fill-opacity=".7">Relevamiento · AutoCAD · Inspección técnica</text>
