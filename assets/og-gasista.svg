<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Jose Pauluk, planos PIG y gestión de gas</title>
  <desc id="desc">Tarjeta azul con dibujo técnico de una vivienda y servicios de planos PIG en Calamuchita.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern></defs>
