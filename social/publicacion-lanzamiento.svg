<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Planos PIG por Jose Pauluk</title>
  <desc id="desc">Pieza de lanzamiento para Facebook con servicios de relevamiento, AutoCAD e inspección técnica en Calamuchita.</desc>
  <defs>
