    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#03101b" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1080" height="1350" fill="#0b2239"/><rect width="1080" height="1350" fill="url(#grid)"/>
  <rect x="70" y="68" width="64" height="64" rx="16" fill="#f5a623"/><text x="102" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="900" fill="#0b2239">JP</text>
  <text x="156" y="94" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#fff">Jose Pauluk</text><text x="156" y="122" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#fff" fill-opacity=".55">VILLA GENERAL BELGRANO</text>
  <text x="70" y="242" font-family="Arial,sans-serif" font-size="18" font-weight="900" letter-spacing="4" fill="#f5a623">DOCUMENTACIÓN TÉCNICA DE GAS</text>
  <text x="70" y="342" font-family="Arial,sans-serif" font-size="82" font-weight="900" fill="#fff">PLANOS</text><text x="70" y="430" font-family="Arial,sans-serif" font-size="108" font-weight="900" fill="#f5a623">PIG</text>
  <text x="70" y="494" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#fff" fill-opacity=".75">del relevamiento al plano,</text><text x="70" y="534" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#fff" fill-opacity=".75">con criterio de obra.</text>
  <g transform="translate(545 205) rotate(2 220 260)" filter="url(#shadow)">
